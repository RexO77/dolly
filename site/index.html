<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#131215">
  <title>Dolly: film your product, then direct the camera</title>
  <meta name="description" content="Dolly records your web app with no cursor, then moves a camera over the take: in where something changes, still while it plays, back out to show the result. Direct it by eye in the Studio. Open source, from the command line.">
  <meta property="og:title" content="Dolly">
  <meta property="og:description" content="Film your product, then direct the camera.">
  <meta property="og:image" content="https://rexo77.github.io/dolly/media/directed.webp">
  <link rel="icon" href="/icon-dark.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/icon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" as="image" href="/media/take.webp">
  <style>html { background: #131215; } html[data-theme="light"] { background: #f5f5f2; }</style>
  <script>
    /* Night unless the visitor picked Light, set before the first paint so a reload never flashes. */
    try { if (localStorage.getItem('dolly.theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <main style="max-width: 720px; margin: 64px auto; padding: 0 16px; font: 16px/1.55 system-ui, sans-serif; color: #e6e5e1; background: #131215">
      <h1>Dolly: film your product, then direct the camera.</h1>
      <p>Dolly records your web app with no cursor, then moves a camera over the take and renders a clip for your site.</p>
      <video src="media/directed.mp4" poster="media/directed.webp" controls muted playsinline style="width: 100%"></video>
      <p><code>npm install -g @nischalskanda/dolly</code></p>
      <p><a href="https://github.com/RexO77/dolly" style="color: inherit">github.com/RexO77/dolly</a></p>
    </main>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
